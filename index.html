<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pendaftaran KOPK LMS (Realtime)</title>

<!-- JS PDF & XLSX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
*{ box-sizing:border-box; }
body{ margin:0; font-family:Arial, sans-serif; display:flex; background:#f1f5f9; }

/* AUTH SECTION STYLING */
.auth-container {
  display: flex; justify-content: center; align-items: center;
  width: 100vw; height: 100vh; background: #0f172a;
  position: fixed; inset: 0; z-index: 9999;
}
.auth-card {
  background: white; padding: 30px; border-radius: 12px;
  width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.auth-card h2 { margin-top: 0; text-align: center; color: #0f172a; }

/* APP LAYOUT */
.sidebar{ width:260px; background:#0f172a; color:white; height:100vh; overflow-y:auto; position:fixed; }
.sidebar h2{ text-align:center; padding:20px 0; margin:0; border-bottom:1px solid rgba(255,255,255,0.1); }
.menu-item{ padding:15px 20px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); }
.menu-item:hover{ background:#1e293b; }
.submenu{ display:none; background:#1e293b; }
.submenu div{ padding:12px 35px; cursor:pointer; }
.submenu div:hover{ background:#334155; }

.main{ margin-left:260px; width:calc(100% - 260px); padding:20px; }
.card{ background:white; padding:20px; border-radius:12px; margin-bottom:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
input, select, button{ width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ccc; }
label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #334155; }
button{ background:#2563eb; color:white; border:none; cursor:pointer; }
button:hover{ background:#1d4ed8; }

.stats{ display:flex; gap:15px; flex-wrap:wrap; }
.stat-box{ flex:1; min-width:180px; background:#2563eb; color:white; padding:20px; border-radius:10px; text-align:center; font-size:18px; }
.hidden{ display:none !important; }
table{ width:100%; border-collapse:collapse; margin-top:15px; }
table th{ background:#0f172a; color:white; padding:12px; }
table td{ padding:10px; border-bottom:1px solid #ddd; }
.action-btn{ width:auto; padding:7px 12px; margin:2px; font-size: 13px; }
.red{ background:red; } .red:hover{ background:#b91c1c; }
.green{ background:green; } .green:hover{ background:#15803d; }
.yellow{ background:#eab308; color: white; } .yellow:hover{ background:#ca8a04; }

/* MODAL STYLING */
.modal{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; z-index: 10000; }
.modal-content{ width:400px; background:white; padding:20px; border-radius:12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }

/* LOADING BUTTON SPINNER */
.btn-loading {
  position: relative;
  pointer-events: none;
  opacity: 0.7;
}
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid #ffffff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  display: inline-block;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- HALAMAN LOGIN -->
<div id="authSection" class="auth-container">
  <div class="auth-card">
    <h2>KOPK LMS Login</h2>
    <input type="email" id="loginEmail" placeholder="E-mel Rasmi">
    <input type="password" id="loginPassword" placeholder="Kata Laluan">

  </div>
</div>

<!-- SIDEBAR -->
<div id="sidebarSection" class="sidebar hidden">

  <div class="menu-item" onclick="showRegister()">Daftar Peserta</div>

  <div class="menu-item" onclick="toggleMenu('eventMenu')">Acara ▼</div>

  <div class="menu-item" onclick="toggleMenu('schoolMenu')">Sekolah ▼</div>
  <div id="schoolMenu" class="submenu"></div>

<!-- KANDUNGAN UTAMA -->
<div id="mainSection" class="main hidden">

  <!-- DASHBOARD -->

      <option value="SK Dato Panglima Bukit Gantang">SK Dato Panglima Bukit Gantang</option>
      <option value="SK Changkat Larut">SK Changkat Larut</option>
      <option value="SK Seri Aman">SK Seri Aman</option>
      <option value="SK Kg Boyan">SK Kg Boyan</option>

      <option value="SK Matang">SK Matang</option>
      <option value="SJKC Sin Min">SJKC Sin Min</option>

      <option value="SK Bukit Jana">SK Bukit Jana</option>

      <option value="SK Kampong Perak">SK Kampong Perak</option>

      <option value="SK Sri Selama">SK Sri Selama</option>
      <option value="SK Bukit Bertam">SK Bukit Bertam</option>
      <option value="SK Sultan Idris II">SK Sultan Idris II</option>

  <!-- ADD EVENT -->
  <div id="addEventSection" class="hidden card">
    <h2>Tambah Acara</h2>
    <input type="text" id="eventName" placeholder="Nama Acara (Contoh: Lontar Peluru)">
    <select id="eventCategory">
      <option value="B12">B12</option>
      <option value="B15">B15</option>

<!-- MODAL DAFTAR ACARA -->
<div class="modal" id="assignModal">
  <div class="modal-content">
    <h3>Daftar Acara</h3>
    <select id="assignEventSelect"></select>
    <button id="btnAssignSave" onclick="confirmAssignEvent()">Simpan</button>
    <button onclick="closeModal()" class="red">Tutup</button>

</div>

<!-- MODAL KEMASKINI/EDIT PESERTA -->
<div class="modal" id="editParticipantModal">
  <div class="modal-content">
    <h3>Kemaskini Maklumat Peserta</h3>
    <label>Nama Peserta:</label>
    <input type="text" id="editNama" placeholder="Nama">
    <label>No Badan:</label>

    <label>No IC:</label>

    <input type="text" id="editKadoku" placeholder="No Kad OKU">

<script>
// Konfigurasi Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCaegle-pxirfzoxTMIdW444IHnKK-kGVc",
  authDomain: "kopk-lms-872f8.firebaseapp.com",
  projectId: "kopk-lms-872f8",
  storageBucket: "kopk-lms-872f8.firebasestorage.app",
  messagingSenderId: "644416357339",
  appId: "1:644416357339:web:af6c526b38063f85395dfe"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth(); 

let currentSchool = null;
let currentActiveEventId = null; 
let EVENTS = {};
let PARTICIPANTS = {};
let EVENT_PARTICIPANTS = [];
let selectedParticipant = null;
let editingParticipantId = null; 
let currentExportData = [];

let unsubscribeEvents = null;
let unsubscribeParticipants = null;
let unsubscribeEventParticipants = null;

// Mengandungi 'Lain-lain' untuk safety net paparan menu
const EVENT_ORDER = ["100 m", "200 m", "400 m", "800 m", "1500 m", "80 m", "Lompat Jauh", "Lompat Tinggi", "Lontar Peluru", "Rejam Lembing", "Lempar Cakera", "Lain-lain"];

// --- FUNCTION LOADING SPINNER ---
function setLoading(button, isLoading, text = "Sila tunggu...") {
  if (!button) return;
  if (isLoading) {
    button.disabled = true;
    button.classList.add("btn-loading");
    button.dataset.originalText = button.innerHTML;
    button.innerHTML = `<span class="spinner"></span>${text}`;
  } else {
    button.disabled = false;
    button.classList.remove("btn-loading");
    button.innerHTML = button.dataset.originalText || button.innerHTML;
  }
}

// --- SYSTEM AUTHENTICATION ---
async function loginUser() {
  const email = document.getElementById("loginEmail").value;
  const kataLaluan = document.getElementById("loginPassword").value;
  const btn = document.querySelector("#authSection button");

  if (!email || !kataLaluan) {
    alert("Sila isi e-mel dan kata laluan");
    return;
  }

  try {
    setLoading(btn, true, "Logging in...");
    await auth.signInWithEmailAndPassword(email, kataLaluan);
    alert("Selamat Datang!");
    document.getElementById("loginEmail").value = "";
    document.getElementById("loginPassword").value = "";
  } catch (error) {
    alert("Ralat: " + error.message);
  } finally {
    setLoading(btn, false);
  }
}

function logoutUser() {
  if(confirm("Adakah anda pasti mahu log keluar?")) {
    if(unsubscribeEvents) unsubscribeEvents();
    if(unsubscribeParticipants) unsubscribeParticipants();
    if(unsubscribeEventParticipants) unsubscribeEventParticipants();
    
    auth.signOut().then(() => { alert("Anda telah log keluar."); });
  }
}

auth.onAuthStateChanged((user) => {
  const authSection = document.getElementById("authSection");
  const sidebarSection = document.getElementById("sidebarSection");
  const mainSection = document.getElementById("mainSection");

  if (user) {
    authSection.classList.add("hidden");
    sidebarSection.classList.remove("hidden");
    mainSection.classList.remove("hidden");
    if(unsubscribeEvents) unsubscribeEvents();
    if(unsubscribeParticipants) unsubscribeParticipants();
    if(unsubscribeEventParticipants) unsubscribeEventParticipants();
    initRealtimeData(); 
    showDashboard();
  } else {
    authSection.classList.remove("hidden");
    sidebarSection.classList.add("hidden");
    mainSection.classList.add("hidden");
    EVENTS = {};
    PARTICIPANTS = {};
    EVENT_PARTICIPANTS = [];
  }
});

// --- CORE UTILITIES ---
function sortEvents(events){
  return events.sort((a, b) => {
    const getOrder = (name) => {
      const found = EVENT_ORDER.find(event => name.toLowerCase().includes(event.toLowerCase()));
      return found ? EVENT_ORDER.indexOf(found) : 999;
    };
    return getOrder(a.name) - getOrder(b.name);
  });
}

function toggleMenu(menuId){
  const menu = document.getElementById(menuId);
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function hideAll(){
  document.querySelectorAll('.main > div').forEach(div => div.classList.add('hidden'));
}

function showDashboard(){
  hideAll();
  document.getElementById('dashboardSection').classList.remove('hidden');
  currentSchool = null;
  currentActiveEventId = null;
  refreshUI();
}

function showRegister(){
  hideAll();
  document.getElementById('registerSection').classList.remove('hidden');
  currentSchool = null;
  currentActiveEventId = null;
}

function showAddEvent(){
  hideAll();
  document.getElementById('addEventSection').classList.remove('hidden');
  currentSchool = null;
  currentActiveEventId = null;
}

// UTAMA: Realtime Sync Menggunakan onSnapshot()
function initRealtimeData(){
  unsubscribeEvents = db.collection("events").onSnapshot(snapshot => {
    EVENTS = {};
    snapshot.forEach(doc => { EVENTS[doc.id] = doc.data(); });
    loadEventMenu();
    refreshUI();
  }, error => console.error("Event Sync Error:", error));

  unsubscribeParticipants = db.collection("participants").onSnapshot(snapshot => {
    PARTICIPANTS = {};
    snapshot.forEach(doc => { PARTICIPANTS[doc.id] = { id: doc.id, ...doc.data() }; });
    refreshUI();
  }, error => console.error("Participant Sync Error:", error));

  unsubscribeEventParticipants = db.collection("eventParticipants").onSnapshot(snapshot => {
    EVENT_PARTICIPANTS = [];
    snapshot.forEach(doc => { EVENT_PARTICIPANTS.push({ id: doc.id, ...doc.data() }); });
    refreshUI();
  }, error => console.error("Join Table Sync Error:", error));
}

function refreshUI() {
  loadStats();
  loadSchools();
  
  if (currentSchool) {
    loadSchoolParticipants(currentSchool);
  }
  if (currentActiveEventId && EVENTS[currentActiveEventId]) {
    loadEventParticipants(currentActiveEventId, EVENTS[currentActiveEventId].name);
  }
}

function loadStats(){
  const participants = Object.values(PARTICIPANTS);
  const schools = new Set(participants.map(p => p.sekolah).filter(Boolean));

  document.getElementById('totalPeserta').innerText = participants.length;
  document.getElementById('totalSekolah').innerText = schools.size;
  document.getElementById('totalAcara').innerText = Object.keys(EVENTS).length;
}

// --- OPERATIONS: REGISTER & ADD EVENT ---
async function registerParticipant() {
  const btn = document.querySelector("#registerSection button");
  const elNama = document.getElementById("nama");
  const elKadoku = document.getElementById("kadoku");
  const elIc = document.getElementById("ic");
  const elNobadan = document.getElementById("nobadan");
  const elSekolah = document.getElementById("sekolah");

  const participant = {
    nama: elNama.value.trim(),
    kadoku: elKadoku.value.trim(),
    ic: elIc.value.trim(),
    nobadan: elNobadan.value.trim(),
    sekolah: elSekolah.value
  };

  if (!participant.nama || !participant.sekolah) {
    alert("Nama dan Sekolah wajib diisi!");
    return;
  }

  try {
    setLoading(btn, true, "Mendaftar...");
    await db.collection("participants").add(participant);
    alert("Peserta berjaya didaftarkan");
    
    elNama.value = ""; elKadoku.value = ""; elIc.value = ""; elNobadan.value = "";
    elSekolah.selectedIndex = 0;
  } catch (error) {
    alert("Ralat: " + error.message);
  } finally {
    setLoading(btn, false);
  }
}

async function addEvent(){
  const btn = document.querySelector("#addEventSection button");
  const nameInput = document.getElementById("eventName");
  const catInput = document.getElementById("eventCategory");
  const schInput = document.getElementById("eventSchool");
  const genInput = document.getElementById("eventGender");

  const data = {
    name: nameInput.value.trim(),
    category: catInput.value,
    school: schInput.value, 
    gender: genInput.value
  };

  if(!data.name) {
    alert("Nama Acara tidak boleh kosong!");
    return;
  }

  try {
    setLoading(btn, true, "Menambah Acara...");
    await db.collection("events").add(data);
    alert("Acara berjaya ditambah");
    nameInput.value = "";
  } catch (error) {
    alert("Ralat: " + error.message);
  } finally {
    setLoading(btn, false);
  }
}

// --- SCHOOL MODULE ---
function loadSchools(){
  const menu = document.getElementById("schoolMenu");
  const dashboard = document.getElementById("dashboardSchools");
  if (!menu || !dashboard) return;
  
  menu.innerHTML = "";

  const participants = Object.values(PARTICIPANTS);
  const schools = [...new Set(participants.map(p => p.sekolah).filter(Boolean))].sort();

  schools.forEach(sekolah => {
    const total = participants.filter(p => p.sekolah === sekolah).length;
    menu.innerHTML += `<div onclick="viewSchool('${sekolah}')">${sekolah} (${total})</div>`;
  });

  dashboard.innerHTML = `
    <table>
      <thead><tr><th>Nama Sekolah</th><th>Jumlah Peserta</th></tr></thead>
      <tbody id="schoolTableBody"></tbody>
    </table>
  `;

  const tbody = document.getElementById("schoolTableBody");
  schools.forEach(sekolah => {
    const total = participants.filter(p => p.sekolah === sekolah).length;
    tbody.innerHTML += `
      <tr style="cursor:pointer" onclick="viewSchool('${sekolah}')">
        <td>${sekolah}</td>
        <td>${total}</td>
      </tr>`;
  });
}

function viewSchool(sekolah) {
  currentSchool = sekolah;
  currentActiveEventId = null;
  hideAll();
  document.getElementById('contentSection').classList.remove('hidden');
  loadSchoolParticipants(sekolah);
}

function loadSchoolParticipants(sekolah){
  const contentTitle = document.getElementById('contentTitle');
  const body = document.getElementById("contentBody");
  if (!contentTitle || !body) return;

  contentTitle.innerText = sekolah;
  body.innerHTML = `
    <button onclick="exportExcel()" style="width:auto; margin-right:10px;">Export Excel</button>
    <button onclick="exportPDF()" style="width:auto;">Export PDF</button>
    <table>
      <thead>
        <tr>
          <th>No Badan</th><th>Nama</th><th>IC</th><th>Acara</th><th>Tindakan</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  `;

  const tbody = document.getElementById("tableBody");
  const filtered = Object.values(PARTICIPANTS).filter(p => p.sekolah === sekolah);
  currentExportData = [];

  filtered.forEach(p => {
    const joins = EVENT_PARTICIPANTS.filter(j => j.participantId === p.id);
    const acaraList = joins.map(j => {
      const e = EVENTS[j.eventId];
      return e ? `${e.name} (${e.category} - ${e.gender})` : null;
    }).filter(Boolean);

    tbody.innerHTML += `
      <tr>
        <td>${p.nobadan || '-'}</td>
        <td>${p.nama}</td>
        <td>${p.ic || '-'}</td>
        <td>${acaraList.join("<br>") || '-'}</td>
        <td>
          <button class="action-btn green" onclick="openAssignModal('${p.id}')">Daftar Acara</button>
          <button class="action-btn yellow" onclick="openEditModal('${p.id}')">Edit</button>
          <button class="action-btn red" onclick="deleteParticipant('${p.id}')">Padam</button>
        </td>
      </tr>`;

    currentExportData.push({
      "No Badan": p.nobadan || '-',
      "Nama": p.nama,
      "IC": p.ic || '-',
      "No Kad OKU": p.kadoku || '-',
      "Sekolah": p.sekolah,
      "Acara": acaraList.join(", ")
    });
  });
}

// --- EDIT & UPDATE OPERATIONS ---
function openEditModal(participantId) {
  editingParticipantId = participantId;
  const p = PARTICIPANTS[participantId];
  
  if (p) {
    document.getElementById("editNama").value = p.nama || "";
    document.getElementById("editNobadan").value = p.nobadan || "";
    document.getElementById("editIc").value = p.ic || "";
    document.getElementById("editKadoku").value = p.kadoku || "";
    document.getElementById('editParticipantModal').style.display = "flex";
  } else {
    alert("Maklumat peserta tidak ditemui!");
  }
}

function closeEditModal() {
  document.getElementById('editParticipantModal').style.display = "none";
  editingParticipantId = null;
}

async function confirmUpdateParticipant() {
  if (!editingParticipantId) return;
  
  const btn = document.getElementById("btnEditSave");
  const namaBaru = document.getElementById("editNama").value.trim();
  const nobadanBaru = document.getElementById("editNobadan").value.trim();
  const icBaru = document.getElementById("editIc").value.trim();
  const kadokuBaru = document.getElementById("editKadoku").value.trim();

  if (!namaBaru) {
    alert("Nama tidak boleh dikosongkan!");
    return;
  }

  const updatedData = {
    nama: namaBaru,
    nobadan: nobadanBaru,
    ic: icBaru,
    kadoku: kadokuBaru,
    sekolah: PARTICIPANTS[editingParticipantId].sekolah 
  };

  try {
    setLoading(btn, true, "Mengemaskini...");
    await db.collection("participants").doc(editingParticipantId).update(updatedData);
    alert("Maklumat peserta berjaya dikemaskini!");
    closeEditModal();
  } catch (error) {
    alert("Gagal mengemaskini: " + error.message);
  } finally {
    setLoading(btn, false);
  }
}

// --- DELETE & ASSIGN MODULATION ---
async function deleteParticipant(id){
  if(!confirm("Padam peserta ini? Semua pendaftaran acara peserta ini juga akan dipadamkan.")) return;

  try {
    await db.collection("participants").doc(id).delete();

    const snapshot = await db.collection("eventParticipants")
      .where("participantId", "==", id)
      .get();

    if (!snapshot.empty) {
      const batch = db.batch();
      snapshot.forEach(doc => {
        batch.delete(doc.ref);
      });
      await batch.commit();
    }

    alert("Peserta berjaya dipadam");

  } catch(error){
    alert("Ralat semasa memadam: " + error.message);
  }
}

function loadEventMenu(){
  const menu = document.getElementById("eventMenu");
  if (!menu) return;
  menu.innerHTML = "";
  const grouped = {};

  const allEvents = Object.entries(EVENTS).map(([id, e]) => ({ id, ...e }));
  const sortedEvents = sortEvents(allEvents);

  sortedEvents.forEach(e => {
    let key = "Lain-lain";
    if(e.name.toLowerCase().includes("100")){ key = "100 m"; }
    else if(e.name.toLowerCase().includes("200")){ key = "200 m"; }
    else if(e.name.toLowerCase().includes("400")){ key = "400 m"; }
    else if(e.name.toLowerCase().includes("800")){ key = "800 m"; }
    else if(e.name.toLowerCase().includes("1500")){ key = "1500 m"; }
    else if(e.name.toLowerCase().includes("80")){ key = "80 m"; }
    else if(e.name.toLowerCase().includes("lompat jauh")){ key = "Lompat Jauh"; }
    else if(e.name.toLowerCase().includes("lompat tinggi")){ key = "Lompat Tinggi"; }
    else if(e.name.toLowerCase().includes("lontar peluru")){ key = "Lontar Peluru"; }
    else if(e.name.toLowerCase().includes("lempar cakera")){ key = "Lempar Cakera"; }
    else if(e.name.toLowerCase().includes("rejam lembing")){ key = "Rejam Lembing"; }

    if(!grouped[key]){ grouped[key] = []; }
    grouped[key].push(e);
  });

  EVENT_ORDER.forEach(category => {
    if(!grouped[category]) return;
    const submenuId = category.replace(/\s/g,'').replace(/-/g,'') + "Menu";

    menu.innerHTML += `
      <div onclick="toggleMenu('${submenuId}')" class="menu-item">${category} ▼</div>
      <div id="${submenuId}" class="submenu"></div>
    `;

    const sub = document.getElementById(submenuId);
    grouped[category].forEach(e => {
      sub.innerHTML += `<div onclick="viewEvent('${e.id}')">${e.name} (${e.category} - ${e.gender})</div>`;
    });
  });
}

function viewEvent(eventId) {
  currentActiveEventId = eventId;
  currentSchool = null;
  hideAll();
  document.getElementById('contentSection').classList.remove('hidden');
  if(EVENTS[eventId]) {
    loadEventParticipants(eventId, EVENTS[eventId].name);
  }
}

function loadEventParticipants(eventId, eventName){
  const contentTitle = document.getElementById('contentTitle');
  const body = document.getElementById("contentBody");
  if (!contentTitle || !body) return;

  contentTitle.innerText = eventName;
  body.innerHTML = `
    <button onclick="exportEventExcel()" style="width:auto;">Export Excel</button>
    <table>
      <thead><tr><th>No Badan</th><th>Nama</th><th>Sekolah</th><th>Tindakan</th></tr></thead>
      <tbody id="eventTable"></tbody>
    </table>
  `;

  const tbody = document.getElementById("eventTable");
  currentExportData = [];

  const filteredJoins = EVENT_PARTICIPANTS.filter(j => j.eventId === eventId);

  filteredJoins.forEach(join => {
    const p = PARTICIPANTS[join.participantId];
    if(p){
      tbody.innerHTML += `
        <tr>
          <td>${p.nobadan || '-'}</td>
          <td>${p.nama}</td>
          <td>${p.sekolah}</td>
          <td><button class="action-btn red" onclick="removeFromEvent('${join.id}')">Padam</button></td>
        </tr>`;

      currentExportData.push({
        "Nama Acara": eventName, "Nama Peserta": p.nama, "No Badan": p.nobadan || '-', "Nama Sekolah": p.sekolah
      });
    }
  });
}

function openAssignModal(participantId){
  selectedParticipant = participantId;
  const select = document.getElementById("assignEventSelect");
  if (!select) return;
  select.innerHTML = "";

  sortEvents(Object.entries(EVENTS).map(([id, e]) => ({ id, ...e }))).forEach(e => {
    select.innerHTML += `<option value="${e.id}">${e.name} (${e.category} - ${e.gender})</option>`;
  });
  document.getElementById('assignModal').style.display = "flex";
}

function closeModal(){ document.getElementById('assignModal').style.display = "none"; }

async function confirmAssignEvent(){
  const eventId = document.getElementById("assignEventSelect").value;
  const btn = document.getElementById("btnAssignSave");
  
  // 1. Ambil maklumat acara yang dipilih berdasarkan ID
  const selectedEventInfo = EVENTS[eventId];
  if (!selectedEventInfo) {
    alert("Maklumat acara tidak ditemui.");
    return;
  }

  // 2. Semak sama ada acara yang dipilih adalah acara Relay (Berganti-ganti)
  // Menyemak perkataan 'relay' atau 'berganti' (tidak kisah huruf besar/kecil)
  const isRelayEvent = selectedEventInfo.name.toLowerCase().includes("relay") || 
                       selectedEventInfo.name.toLowerCase().includes("berganti");

  // 3. Kira jumlah acara sedia ada (tidak termasuk acara Relay yang dia dah join)
  const currentJoins = EVENT_PARTICIPANTS.filter(j => j.participantId === selectedParticipant);
  
  let nonRelayCount = 0;
  currentJoins.forEach(j => {
    const e = EVENTS[j.eventId];
    if (e) {
      const isRegisteredRelay = e.name.toLowerCase().includes("relay") || e.name.toLowerCase().includes("berganti");
      if (!isRegisteredRelay) {
        nonRelayCount++;
      }
    }
  });

  // 4. SEKATAN: Jika acara baru BUKAN relay, dan acara bukan-relay sedia ada dah cukup/lebih 3
  if (!isRelayEvent && nonRelayCount >= 3) {
    alert("Had Maksimum Terlampau: Peserta ini sudah mendaftar 3 acara individu/bukan-relay. Hanya acara Relay sahaja dibenarkan tambah.");
    return;
  }

  // 5. Semak jika peserta sudah mendaftar acara yang SAMA untuk elakkan pertindihan
  const isAlreadyRegistered = currentJoins.some(j => j.eventId === eventId);
  if(isAlreadyRegistered){ 
    alert("Peserta sudah didaftarkan untuk acara ini"); 
    return; 
  }

  const newJoin = { participantId: selectedParticipant, eventId: eventId };
  
  try {
    setLoading(btn, true, "Menyimpan...");
    await db.collection("eventParticipants").add(newJoin);
    alert("Peserta berjaya dimasukkan ke dalam acara");
    closeModal();
  } catch (error) {
    alert("Ralat: " + error.message);
  } finally {
    setLoading(btn, false);
  }
}

async function removeFromEvent(joinId){
  if(!confirm("Padam peserta dari acara ini?")) return;
  try {
    await db.collection("eventParticipants").doc(joinId).delete();
    alert("Berjaya dipadam");
  } catch(error) {
    alert("Ralat memadam: " + error.message);
  }
}

// --- DATA EXPORTS (PDF & EXCEL) ---
async function exportPDF(){
  if(currentExportData.length === 0){ alert("Tiada data untuk di-export"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape' });
  const contentTitle = document.getElementById('contentTitle');

  doc.setFontSize(16);
  doc.text(`Senarai Peserta - ${contentTitle.innerText}`, 14, 15);

  doc.autoTable({
    startY: 25,
    head: [['No Badan', 'Nama', 'No IC', 'No Kad OKU', 'Acara Disertai']],
    body: currentExportData.map(p => [p['No Badan'], p['Nama'], p['IC'], p['No Kad OKU'], p['Acara']]),
    styles: { fontSize: 8, cellPadding: 3, overflow: 'linebreak' },
    headStyles: { fillColor: [15, 23, 42], textColor: 255, fontStyle: 'bold' },
    columnStyles: { 0: { cellWidth: 20 }, 1: { cellWidth: 45 }, 2: { cellWidth: 35 }, 3: { cellWidth: 35 }, 4: { cellWidth: 100 } }
  });

  doc.save(`${contentTitle.innerText}.pdf`);
}

function exportExcel(){
  if(currentExportData.length === 0){ alert("Tiada data untuk di-export"); return; }
  const worksheet = XLSX.utils.json_to_sheet(currentExportData);
  worksheet['!cols'] = [{ wch: 12 }, { wch: 30 }, { wch: 20 }, { wch: 25 }, { wch: 50 }];
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Peserta");
  
  // 🟢 PENAMBAHBAIKAN 2: Dinamikkan nama fail sekolah untuk mengelakkan overwrite fail
  const contentTitle = document.getElementById('contentTitle');
  const fileName = `Peserta_${contentTitle.innerText.replace(/\s+/g, "_")}.xlsx`;
  XLSX.writeFile(workbook, fileName);
}

function exportEventExcel(){
  if(currentExportData.length === 0){ alert("Tiada data untuk di-export"); return; }
  const worksheet = XLSX.utils.json_to_sheet(currentExportData);
  worksheet['!cols'] = [{ wch: 35 }, { wch: 30 }, { wch: 15 }, { wch: 30 }];
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Acara");
  const contentTitle = document.getElementById('contentTitle');
  const fileName = contentTitle.innerText.replace(/\s+/g, "_");
  XLSX.writeFile(workbook, fileName + ".xlsx");
}
